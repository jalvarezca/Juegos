<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reino: construye y defiende</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3ede2; --surface:#fffdf8; --chip:#efe6d6; --ink:#2e2418; --muted:#7a6a55;
  --edge:rgba(46,36,24,.1); --lift:0 10px 28px rgba(46,36,24,.13);
  --accent:#d9822b; --accent-ink:#fff; --royal:#3d5ba9; --good:#2f8f4e; --warn:#d64545; --gold:#f2b33d;
  --grass1:#b5d98c; --grass2:#9cc873; --road:#dcc193; --scrim:rgba(25,18,10,.55);
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1a1610; --surface:#262019; --chip:#342b22; --ink:#f2ebe0; --muted:#b9a990;
    --edge:rgba(242,235,224,.08); --lift:0 10px 28px rgba(0,0,0,.45);
    --good:#5ccf84; --warn:#ff7070; --grass1:#3e5a2d; --grass2:#344d26; --road:#6e5a3c; --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1a1610; --surface:#262019; --chip:#342b22; --ink:#f2ebe0; --muted:#b9a990;
  --edge:rgba(242,235,224,.08); --lift:0 10px 28px rgba(0,0,0,.45);
  --good:#5ccf84; --warn:#ff7070; --grass1:#3e5a2d; --grass2:#344d26; --road:#6e5a3c; --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
html{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;color:var(--ink);
  font-family:"Baloo 2",ui-rounded,"SF Pro Rounded","Segoe UI",Roboto,system-ui,sans-serif;
  background:radial-gradient(800px 380px at 10% -10%, rgba(217,130,43,.18), transparent 60%),radial-gradient(700px 360px at 110% 0%, rgba(61,91,169,.18), transparent 55%),var(--paper);
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:max(12px, env(safe-area-inset-top)) 12px 0}
.back{align-self:flex-start;margin:-2px 0 -4px;padding:2px;border-radius:8px;color:var(--muted);font-weight:700;font-size:14px;line-height:1.2;text-decoration:none}
.back:hover{color:var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{display:block;width:54px;flex:none;line-height:0}
.logo svg{width:100%;height:auto}
.brand h1{margin:0;font-size:30px;line-height:1;font-weight:800;letter-spacing:-.4px}
.brand p{margin:2px 0 0;font-size:13.5px;line-height:1.1;color:var(--muted);font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--edge);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.resbar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.rc{display:flex;align-items:center;justify-content:center;gap:3px;padding:4px 2px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--edge);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;min-width:0}
.rc span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:360px){.rc{font-size:12.5px;gap:1px;padding:4px 1px}}
.questbar{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:0;border-radius:16px;text-align:left;cursor:pointer;background:var(--surface);box-shadow:inset 0 0 0 1px var(--edge)}
.questbar .qi{font-size:22px;flex:none}
.questbar .qt{flex:1;min-width:0;font-weight:700;font-size:14.5px;line-height:1.15}
.questbar .qp{flex:none;font-weight:800;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.questbar.done{box-shadow:inset 0 0 0 2px var(--good)}
.questbar.done .qp{color:#fff;background:var(--good);padding:3px 10px;border-radius:999px}
.view{min-height:420px;padding-bottom:6px}
.tabs{position:sticky;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin:0 -12px;padding:6px 8px max(8px, env(safe-area-inset-bottom));background:color-mix(in srgb, var(--surface) 92%, transparent);box-shadow:0 -6px 18px rgba(0,0,0,.08);backdrop-filter:blur(8px)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 0;border:0;border-radius:12px;background:none;cursor:pointer;font-weight:700;font-size:11.5px;line-height:1.1;color:var(--muted)}
.tab b{font-size:21px;line-height:1.2}
.tab[aria-selected="true"]{background:var(--chip);color:var(--ink)}
.tab .dot{position:absolute;top:3px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--surface)}
.foot{display:flex;flex-direction:column;gap:8px;padding:12px 0 18px;color:var(--muted);font-size:13.5px;line-height:1.3;font-weight:600}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;padding:3px;gap:2px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--edge)}
.seg button{border:0;background:none;padding:5px 10px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* Elementos comunes */
.card{background:var(--surface);border-radius:18px;padding:12px;box-shadow:inset 0 0 0 1px var(--edge)}
.card + .card{margin-top:8px}
h2.ttl{margin:4px 2px 8px;font-size:22px;line-height:1.1;font-weight:800}
h3{margin:0 0 6px;font-size:17px;font-weight:800;line-height:1.15}
.muted{color:var(--muted);font-weight:600}
.small{font-size:13.5px;line-height:1.3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:13px;padding:9px 14px;font-weight:800;font-size:15.5px;cursor:pointer;background:var(--chip);line-height:1.1}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.royal{background:var(--royal);color:#fff}
.btn.good{background:var(--good);color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn:not(:disabled):active,.bld:active,.tile:not(:disabled):active,.hcard:active{transform:scale(.97)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns .btn{flex:1 1 auto}
.costs{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
.c{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:999px;background:var(--chip);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.c.miss{color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.reqs{list-style:none;margin:4px 0;padding:0;display:flex;flex-direction:column;gap:2px;font-weight:700;font-size:14px}
.reqs li.no{color:var(--warn)}
.reason{color:var(--warn);font-weight:700;font-size:14px;margin-top:4px}
.pbar{position:relative;height:9px;border-radius:999px;background:var(--chip);overflow:hidden}
.pbar>i{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;background:linear-gradient(90deg,#ffcf70,var(--accent))}
.pbar.blue>i{background:linear-gradient(90deg,#9ec2ff,var(--royal))}
.pbar.green>i{background:linear-gradient(90deg,#a9e9b8,var(--good))}
.timer{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-radius:14px;background:var(--chip);margin-top:6px}
.timer .tl{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.timer .tl b{font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px;margin:6px 0}
.kv div{background:var(--chip);border-radius:12px;padding:5px 8px;font-weight:700;font-size:13px;color:var(--muted);line-height:1.15}
.kv b{display:block;color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}

/* Ciudad */
.queue{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.townmap{border-radius:22px;padding:8px;background:linear-gradient(160deg,var(--grass1),var(--grass2));box-shadow:var(--lift)}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
@media (min-width:500px){.tgrid{grid-template-columns:repeat(4,1fr)}}
.bld{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;padding:8px 4px 7px;border:0;border-radius:16px;cursor:pointer;background:color-mix(in srgb, var(--surface) 88%, transparent);box-shadow:0 3px 0 rgba(0,0,0,.08)}
.bld .ico{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;font-size:28px;line-height:1;background:radial-gradient(circle at 35% 30%,#fff,var(--chip))}
.bld.k-res .ico{background:radial-gradient(circle at 35% 30%,#fff,#cfe9b8)}
.bld.k-mil .ico{background:radial-gradient(circle at 35% 30%,#fff,#f2c9b8)}
.bld.k-hero .ico{background:radial-gradient(circle at 35% 30%,#fff,#f5dfa0)}
.bld .lv{position:absolute;top:5px;right:6px;min-width:22px;padding:0 5px;border-radius:999px;background:var(--royal);color:#fff;font-weight:800;font-size:12.5px;line-height:20px;text-align:center}
.bld .nm{font-weight:800;font-size:13px;line-height:1.05;text-align:center;max-width:100%;overflow-wrap:anywhere;text-wrap:balance}
@media (max-width:360px){.bld .nm{font-size:12px}}
.bld .st{font-weight:700;font-size:11.5px;line-height:1.15;color:var(--muted);text-align:center;min-height:14px;font-variant-numeric:tabular-nums}
.bld .pbar{width:86%;height:6px;margin-top:2px}
.bld.locked{filter:grayscale(1);opacity:.55}
.bld .bub{position:absolute;top:2px;left:4px;font-size:18px;animation:bob 1.2s ease-in-out infinite alternate}
.bld .upok{position:absolute;top:40px;left:calc(50% + 14px);width:18px;height:18px;border-radius:50%;background:var(--good);color:#fff;font-size:12px;line-height:18px;font-weight:800}
@keyframes bob{to{transform:translateY(-4px)}}

/* Pueblo ilustrado */
.scene{position:relative;width:100%;aspect-ratio:100/126;border-radius:22px;overflow:hidden;box-shadow:var(--lift)}
.scene .ground{position:absolute;inset:0;width:100%;height:100%}
:root[data-theme="dark"] .scene .ground{filter:brightness(.8) saturate(.9)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .scene .ground{filter:brightness(.8) saturate(.9)}}
.spot{position:absolute;display:flex;flex-direction:column;align-items:center;padding:0;border:0;background:none;cursor:pointer;transform:translate(-50%,-100%);-webkit-tap-highlight-color:transparent}
.spot .art{display:block;width:100%;line-height:0;transition:transform .12s}
.spot .art svg{width:100%;height:auto;filter:drop-shadow(0 2px 1px rgba(0,0,0,.18))}
.spot:hover .art{transform:translateY(-2px)}
.spot:active .art{transform:scale(.96)}
.spot:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
.spot .tag{display:inline-flex;align-items:center;gap:3px;margin-top:-7%;padding:1px 7px 1px 2px;border-radius:999px;background:rgba(30,24,16,.75);color:#fff;font-weight:800;font-size:clamp(9px,2.5vw,11.5px);line-height:1.3;white-space:nowrap}
.spot .tag .lv{min-width:17px;padding:0 4px;border-radius:999px;background:var(--royal);font-size:.92em;text-align:center}
.spot.locked .tag{background:rgba(30,24,16,.5)}
.spot .tag .lv.lk{background:#7a6a55;font-size:.85em}
.spot .tag .lv.nb{background:var(--accent)}
.spot .tag .up{display:inline-grid;place-items:center;width:15px;height:15px;margin-right:-4px;border-radius:50%;background:var(--good);font-size:10px;line-height:1}
.spot .st{position:absolute;top:34%;left:50%;transform:translateX(-50%);padding:1px 7px;border-radius:999px;background:rgba(255,253,248,.94);color:#2e2418;font-weight:800;font-size:clamp(9.5px,2.6vw,11px);line-height:1.35;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.spot .pbar{position:absolute;top:52%;left:18%;right:18%;height:5px;background:rgba(0,0,0,.25)}
.spot .bub{position:absolute;top:22%;left:8%;display:grid;place-items:center;width:clamp(22px,7vw,28px);height:clamp(22px,7vw,28px);border-radius:50%;background:#fffdf8;box-shadow:0 2px 5px rgba(0,0,0,.25);font-size:clamp(12px,3.6vw,16px);animation:bob 1.1s ease-in-out infinite alternate}

/* Hoja de detalles */
.sheet{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet.on{display:flex}
@media (min-width:600px){.sheet{align-items:center}}
.sheet-card{position:relative;width:100%;max-width:540px;max-height:90vh;max-height:90svh;overflow:auto;padding:16px 14px max(16px, env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:var(--paper);box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .25s ease}
@media (min-width:600px){.sheet-card{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.x{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;border-radius:50%;background:var(--chip);font-size:20px;font-weight:800;cursor:pointer;line-height:1}
.sh-head{display:flex;align-items:center;gap:10px;margin:0 40px 8px 0}
.sh-head .ico{display:grid;place-items:center;flex:none;width:58px;height:58px;border-radius:50%;font-size:34px;background:radial-gradient(circle at 35% 30%,#fff,var(--chip))}
.sh-head h2{margin:0;font-size:23px;line-height:1.05;font-weight:800}
.sh-head p{margin:2px 0 0}
.sh-head .ico.art{width:92px;height:84px;border-radius:18px;background:linear-gradient(160deg,#b8e08f,#8fc865);line-height:0;padding:2px}
.sh-head .ico.art svg{width:100%;height:100%}
.sh-head .ico.art.map{width:70px;height:70px;padding:6px}
.sh-head .por{width:64px;height:64px}
.tiers{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.tiers button{border:0;border-radius:11px;padding:5px 10px;background:var(--chip);font-weight:800;cursor:pointer}
.tiers button[aria-pressed="true"]{background:var(--royal);color:#fff}
.tiers button:disabled{opacity:.45;cursor:default}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;padding:8px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--edge)}
.li .ic{flex:none;font-size:24px;width:34px;text-align:center}
.li .tx{flex:1;min-width:0;line-height:1.15}
.li .tx b{display:block;font-size:15px}
.li .tx small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}

/* Héroes */
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:500px){.hgrid{grid-template-columns:repeat(4,1fr)}}
.hcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:0;border-radius:16px;cursor:pointer;background:var(--surface);box-shadow:inset 0 0 0 3px var(--rc,#999)}
.hcard.no{opacity:.55;filter:grayscale(.8)}
.por{position:relative;display:grid;place-items:center;width:54px;height:54px;border-radius:50%;font-weight:800;font-size:26px;color:#fff;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--rc,#999) 55%,#fff),var(--rc,#999))}
.por .ty{position:absolute;right:-6px;bottom:-4px;font-size:18px}
.por.art{background:none;box-shadow:0 0 0 2.5px var(--rc,#999);overflow:visible}
.por.art svg{width:100%;height:100%;border-radius:50%;display:block}
.hcard .hn{font-weight:800;font-size:14px;line-height:1.1}
.hcard .hl{font-weight:700;font-size:12px;color:var(--muted)}
.stars{color:var(--gold);font-size:12px;letter-spacing:1px;min-height:14px}
.hcard .tm{position:absolute;top:4px;left:6px;font-size:14px}

/* Defensa */
.stage{position:relative;width:100%;margin:0 auto;aspect-ratio:360/560;border-radius:20px;overflow:hidden;box-shadow:var(--lift);touch-action:none;user-select:none;-webkit-user-select:none;
  max-width:max(260px, calc((100vh - 230px) * 360 / 560));max-width:max(260px, calc((100svh - 230px) * 360 / 560))}
.stage.play{max-width:max(260px, calc((100vh - 190px) * 360 / 560));max-width:max(260px, calc((100svh - 190px) * 360 / 560))}
#tdCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.hud{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;justify-content:space-between;pointer-events:none}
.hud span{padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums}
.tdbar{display:flex;gap:6px;margin-top:8px}
.tdbar .btn{flex:1;padding:8px 6px;font-size:14.5px}
.slots{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
.slots button{border:0;border-radius:10px;padding:5px 0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--edge);font-weight:800;font-size:13px;cursor:pointer}
.pop{position:absolute;z-index:4;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:14px;background:var(--surface);box-shadow:0 8px 24px rgba(0,0,0,.3);min-width:150px}
.pop .btn{padding:7px 10px;font-size:14px;justify-content:space-between}
.result{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--scrim)}
.result .card{width:100%;max-width:300px;text-align:center;padding:16px}
.result h3{font-size:24px}
.bigstars{font-size:34px;color:var(--gold);letter-spacing:4px;margin:4px 0}

/* Expedición */
.form{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.form .slotb{grid-column:span 3}
.form .slotb.back{grid-column:span 2}
.slotb{display:flex;align-items:center;gap:6px;padding:6px;border:0;border-radius:14px;background:var(--chip);cursor:pointer;min-width:0;text-align:left}
.slotb .por{width:38px;height:38px;font-size:18px;flex:none}
.slotb .por .ty{font-size:13px;right:-4px;bottom:-3px}
.slotb b{display:block;font-size:13.5px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slotb small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.rowlbl{grid-column:1/-1;font-weight:800;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.battle{display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:18px;background:linear-gradient(180deg,#3b3326,#5a4a33);color:#fff}
.bside{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.bu{position:relative;width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s}
.bu .por{width:44px;height:44px;font-size:20px}
.bu .pbar{width:100%;height:6px;background:rgba(255,255,255,.2)}
.bu .pbar>i{background:linear-gradient(90deg,#8be08b,#2f8f4e);transition:width .25s}
.bu .nm{font-size:11px;font-weight:700;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bu.dead{opacity:.3;filter:grayscale(1)}
.bu.act{transform:translateY(-6px) scale(1.08)}
.bu.hit{animation:shake .3s}
.fl{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-weight:800;font-size:15px;text-shadow:0 2px 0 rgba(0,0,0,.5);animation:fl .7s ease forwards;pointer-events:none;white-space:nowrap}
.blog{min-height:20px;text-align:center;font-weight:700;font-size:14px}
@keyframes shake{30%{transform:translateX(-5px)}60%{transform:translateX(4px)}}
@keyframes fl{to{transform:translate(-50%,-26px);opacity:0}}

/* Mapa */
.mapwrap{border-radius:20px;padding:6px;background:linear-gradient(160deg,var(--grass1),var(--grass2));box-shadow:var(--lift)}
.mgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.tile{position:relative;aspect-ratio:1;display:grid;place-items:center;border:0;border-radius:9px;padding:0;background:rgba(255,255,255,.18);font-size:clamp(15px,5.2vw,26px);line-height:1;cursor:pointer}
.tile:disabled{cursor:default;background:rgba(255,255,255,.08);font-size:clamp(12px,3.6vw,18px);opacity:.65}
.tile.home{background:rgba(255,255,255,.45)}
.tile svg{width:88%;height:88%;display:block}
.tile.home svg{width:110%;height:110%}
.tile .tb{position:absolute;bottom:1px;right:2px;padding:0 3px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font-weight:800;font-size:10px;line-height:13px}
.tile .fl2{position:absolute;top:0;left:1px;font-size:11px}
.tile.busy{box-shadow:inset 0 0 0 2px var(--royal)}
.tsl{display:flex;flex-direction:column;gap:4px}
.tsl label{display:flex;justify-content:space-between;font-weight:800;font-size:14px}

/* Misiones */
.chests{display:flex;justify-content:space-between;gap:4px;margin:8px 0 4px}
.chests button{flex:1;display:flex;flex-direction:column;align-items:center;border:0;border-radius:12px;padding:5px 0;background:var(--chip);font-weight:800;font-size:12px;cursor:pointer}
.chests button b{font-size:22px;line-height:1.1}
.chests button.ready{background:var(--gold);color:#3a2a00;animation:bob .8s ease-in-out infinite alternate}
.chests button.done{opacity:.45}

/* Avisos */
.toasts{position:fixed;left:50%;top:max(10px, env(safe-area-inset-top));z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(-50%);width:min(92vw,420px);pointer-events:none}
.toast{padding:8px 14px;border-radius:14px;background:rgba(30,24,16,.92);color:#fff;font-weight:700;font-size:14.5px;line-height:1.2;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:tin .25s ease}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
@media (prefers-reduced-motion: reduce){
  .bld .bub,.spot .bub,.chests button.ready,.sheet-card,.toast,.bu.hit,.fl{animation:none}
  .bu{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <a class="back" href="../" data-i18n="menu">Volver al menú</a>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">🏰</span>
      <div>
        <h1 data-i18n="title">Reino</h1>
        <p data-i18n="tagline">Construye tu ciudad y defiéndela</p>
      </div>
    </div>
    <div class="pills">
      <span class="pill" id="powerPill">⚔️ <span id="power">0</span></span>
      <span class="pill">💎 <span id="gems">0</span></span>
    </div>
  </header>
  <div class="resbar" id="resbar"></div>
  <button class="questbar" id="questbar" type="button"></button>
  <main class="view" id="view" tabindex="-1"></main>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <footer class="foot">
    <span data-i18n="help">Mejora los edificios para hacer crecer el Centro urbano, entrena tropas, recluta héroes y defiende el pueblo.</span>
    <div class="row">
      <span id="langLabel" data-i18n="lang">Idioma</span>
      <div class="seg" role="group" aria-labelledby="langLabel">
        <button type="button" data-lang="es" lang="es" aria-pressed="true">Español</button>
        <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
        <button type="button" data-lang="fr" lang="fr" aria-pressed="false">Français</button>
      </div>
    </div>
    <div class="row">
      <button type="button" class="btn" id="soundBtn" aria-pressed="true">🔊 <span data-i18n="sound">Sonido</span></button>
      <button type="button" class="btn" id="resetBtn">↺ <span data-i18n="reset">Empezar de cero</span></button>
    </div>
  </footer>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-card">
    <button type="button" class="x" id="sheetClose" data-i18n-aria="close" aria-label="Cerrar">×</button>
    <div id="sheetBody"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-hidden="true"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script src="datos.js"></script>
<script src="motor.js"></script>
<script src="defensa.js"></script>
<script src="textos.js"></script>
<script src="arte.js"></script>
<script src="interfaz.js"></script>
</body>
</html>
