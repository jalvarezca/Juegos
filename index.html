<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juegos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eceef6; --surface:#f8f9fd; --chip:#e7e9f4; --ink:#2b2851; --muted:#6b6890;
  --edge:rgba(43,40,81,.08); --lift:0 12px 28px rgba(43,40,81,.10);
  --nose:#ff6f91; --play:#2b2851;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#17162a; --surface:#221f3a; --chip:#2c2948; --ink:#ecebfa; --muted:#a6a3c8;
    --edge:rgba(236,235,250,.08); --lift:0 12px 28px rgba(0,0,0,.35);
    --play:#ecebfa;
    color-scheme:dark;
  }
}
html{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;color:var(--ink);
  font-family:"Baloo 2",ui-rounded,"SF Pro Rounded","Segoe UI",Roboto,system-ui,sans-serif;
  background:
    radial-gradient(900px 420px at 15% -10%, rgba(255,111,145,.28), transparent 60%),
    radial-gradient(700px 380px at 110% 0%, rgba(148,121,214,.30), transparent 55%),
    var(--paper);
  -webkit-tap-highlight-color:transparent;
}
:focus-visible{outline:3px solid var(--nose);outline-offset:3px}
.shell{
  max-width:880px;margin:0 auto;
  padding:max(28px, env(safe-area-inset-top)) 18px max(32px, env(safe-area-inset-bottom));
}
header{margin-bottom:22px}
.mark{
  width:64px;height:64px;display:grid;place-items:center;margin-bottom:10px;
  border-radius:22px;background:var(--surface);box-shadow:var(--lift);
  font-size:34px;line-height:1;
}
h1{margin:0;font-size:clamp(40px, 8vw, 56px);line-height:.95;font-weight:800;letter-spacing:-.6px}
.lead{margin:8px 0 0;max-width:36ch;color:var(--muted);font-weight:600;font-size:18px;line-height:1.25}
.count{margin:14px 0 0;font-weight:700;font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 320px), 1fr));gap:14px}
.card{
  display:flex;align-items:center;gap:14px;min-height:108px;
  padding:16px;border-radius:24px;text-decoration:none;color:inherit;
  background:var(--surface);box-shadow:var(--lift), inset 0 0 0 1px var(--edge);
  transition:transform .12s ease;
}
.card:hover{transform:translateY(-2px)}
.card:active{transform:scale(.985)}
.icon{
  flex:none;width:64px;height:64px;display:grid;place-items:center;
  border-radius:20px;background:var(--chip);font-size:34px;line-height:1;
}
.body{min-width:0;flex:1}
.card h2{margin:0;font-size:24px;line-height:1.05;font-weight:800}
.card p{margin:4px 0 0;color:var(--muted);font-weight:600;font-size:15px;line-height:1.25}
.play{
  flex:none;padding:8px 12px;border-radius:999px;background:var(--play);color:var(--paper);
  font-weight:800;font-size:14px;line-height:1;
}
@media (max-width: 380px){
  .play{display:none}
}
.empty{
  margin:8px 0 0;padding:22px;border-radius:24px;background:var(--surface);
  box-shadow:inset 0 0 0 1px var(--edge);color:var(--muted);font-weight:700;text-align:center;
}
footer{margin-top:28px;color:var(--muted);font-size:14px;font-weight:600;line-height:1.35}
footer code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
@media (prefers-reduced-motion: reduce){
  .card{transition:none}
}
</style>
</head>
<body>
<main class="shell">
  <header>
    <div class="mark" aria-hidden="true">🎲</div>
    <h1>Juegos</h1>
    <p class="lead">Elige uno y empieza a jugar. Cada juego vive en su propia carpeta.</p>
    <p class="count" id="count"></p>
  </header>
  <div class="grid" id="games"></div>
  <p class="empty" id="empty" hidden>Todavía no hay juegos en el menú.</p>
  <footer>Para añadir un juego, crea su carpeta y registra una entrada en la lista <code>GAMES</code> de esta página.</footer>
</main>
<script>
/*
  Cómo añadir un juego
  --------------------
  1. Crea una carpeta en la raíz del repositorio (nombre en kebab-case)
     con un index.html. Ejemplo: memoria/index.html
  2. Añade un objeto a GAMES, aquí abajo:
       { title, description, folder, emoji }
     - title:        nombre que se ve en la tarjeta
     - description:  una frase corta
     - folder:       nombre de la carpeta (sin barras)
     - emoji:        un emoji que sirva de icono
  3. La tarjeta enlaza a ./<folder>/  (en GitHub Pages, la URL del sitio + esa carpeta).
     Dentro del juego, un enlace a "../" vuelve a este menú.
*/
const GAMES = [
  {
    title: "Michis",
    description: "Pon un gato en cada color: uno por fila y columna, sin que se toquen.",
    folder: "michis",
    emoji: "🐱"
  }
];

const list = document.getElementById("games");
const empty = document.getElementById("empty");
const count = document.getElementById("count");

const folderOk = name => typeof name === "string" && /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(name);

GAMES.forEach(game => {
  if (!folderOk(game.folder)) return;
  const a = document.createElement("a");
  a.className = "card";
  a.href = "./" + game.folder + "/";

  const icon = document.createElement("span");
  icon.className = "icon";
  icon.setAttribute("aria-hidden", "true");
  icon.textContent = game.emoji || "🎮";

  const body = document.createElement("span");
  body.className = "body";
  const h2 = document.createElement("h2");
  h2.textContent = game.title || game.folder;
  const p = document.createElement("p");
  p.textContent = game.description || "";
  body.append(h2, p);

  const play = document.createElement("span");
  play.className = "play";
  play.textContent = "Jugar";

  a.setAttribute("aria-label", "Jugar a " + (game.title || game.folder));
  a.append(icon, body, play);
  list.append(a);
});

const n = list.children.length;
count.textContent = n === 1 ? "1 juego" : n + " juegos";
empty.hidden = n !== 0;
</script>
</body>
</html>
